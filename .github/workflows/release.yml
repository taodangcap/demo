name: release-ota

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            7.0.x
            10.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release tag: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore ShowCuePlayer.sln
          dotnet build ShowCuePlayer.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}
          dotnet test ShowCuePlayer.Tests/ShowCuePlayer.Tests.csproj -c Release --no-build

      - name: Publish self-contained x64
        shell: pwsh
        run: |
          dotnet publish ShowCuePlayer.csproj -c Release --no-restore `
            -p:PublishProfile=Properties\PublishProfiles\WindowsX64SingleFile.pubxml `
            -p:Version=${{ steps.version.outputs.value }}

      - name: Verify publish output
        shell: pwsh
        run: |
          $publishDir = "publish\win-x64"
          foreach ($file in @("ShowCuePlayer.exe", "bass.dll")) {
            $path = Join-Path $publishDir $file
            if (!(Test-Path $path)) { throw "Missing required file in publish output: $path" }
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" "installer\ShowCuePlayer.iss"

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $setup = "installer-output\7zyx-Media-Setup-${{ steps.version.outputs.value }}-x64.exe"
          $name = Split-Path $setup -Leaf
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "$setup.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "installer-output\7zyx-Media-Setup-${{ steps.version.outputs.value }}-x64.exe"
          gh release create "${{ github.ref_name }}" $setup "$setup.sha256" `
            --verify-tag `
            --title "7zyx Media ${{ steps.version.outputs.value }}" `
            --generate-notes
