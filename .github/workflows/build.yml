name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            7.0.x
            10.0.x
      - run: dotnet restore ShowCuePlayer.sln
      - run: dotnet build ShowCuePlayer.sln -c Release --no-restore
      - run: dotnet test ShowCuePlayer.Tests/ShowCuePlayer.Tests.csproj -c Release --no-build
